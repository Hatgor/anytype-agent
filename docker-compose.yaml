services:
  anytype-cli:
    image: ghcr.io/anyproto/anytype-cli:latest
    command: ["serve", "--listen-address", "0.0.0.0:31012"]
    volumes:
      - ./.anytype/data:/root/.anytype
      - ./.anytype/config:/root/.config/anytype
    ports:
      - "31012:31012"

  anytype-agent:
    build: .
    environment:
      - ANYTYPE_API_URL=http://anytype-cli:31012
      - ANYTYPE_BOT_NAME=GeminiDevBot
      - ANYTYPE_API_KEY=CX3NvcW5ofQlmF17BKOGjMnBakMtlj6D7qcH+qep+x0=
    volumes:
      - ./src:/app/src
    ports:
      - "31013:31013"
